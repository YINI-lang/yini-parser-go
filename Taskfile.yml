version: '3'

vars:
  GRAMMAR_BASE: grammar/v1.0.0-rc.7
  LEXER_FILE: '{{.GRAMMAR_BASE}}/YiniLexer.g4'
  PARSER_FILE: '{{.GRAMMAR_BASE}}/YiniParser.g4'
  ANTLR_JAR: libs/antlr4/antlr-4.13.2-complete.jar
  DIR_OUTPUT: internal/grammar/generated

tasks:
  generate:
    desc: Generate the Go lexer and parser from the checked-in grammar.
    cmds:
      - >
        java -jar {{.ANTLR_JAR}}
        -Dlanguage=Go -visitor -no-listener -package generated
        -Xexact-output-dir -o {{.DIR_OUTPUT}}
        {{.LEXER_FILE}} {{.PARSER_FILE}}
      - go fmt ./{{.DIR_OUTPUT}}

  fmt:
    desc: Format Go packages.
    cmds:
      - go fmt ./...

  vet:
    desc: Run Go analyzers, excluding unreachable-code reports from generated ANTLR code.
    cmds:
      - go vet -unreachable=false ./...

  test:
    desc: Run all Go tests.
    cmds:
      - go test ./...

  versions:
    desc: List published module versions.
    cmds:
      - go list -m -versions github.com/YINI-lang/yini-parser-go

  release:
    desc: Run checks and create an annotated Git tag from VERSION.
    cmds:
      - task: check
      - go run ./cmd/release-tag

  check:
    desc: Format, analyze, and test the module.
    cmds:
      - task: fmt
      - task: vet
      - task: test
