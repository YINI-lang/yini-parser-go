name: Go Tests

on:
    pull_request:

jobs:
    run-all-tests:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v7
              with:
                  go-version-file: go.mod
                  cache-dependency-path: go.sum

            - name: Run tests
              run: go test ./...
