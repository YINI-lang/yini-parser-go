# Runs the shared YINI smoke tests against the Go parser.

name: (external) YINI Test Suite Smoke

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

jobs:
    yini-test-suite-smoke:
        name: Run shared YINI smoke tests
        runs-on: ubuntu-latest

        steps:
            - name: Check out code
              uses: actions/checkout@v7

            - name: Set up Go
              uses: actions/setup-go@v7
              with:
                  go-version-file: go.mod
                  cache-dependency-path: go.sum

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: '3.12'

            - name: Build Go adapter
              run: go build -o "$RUNNER_TEMP/yini-test-adapter" ./cmd/yini-test-adapter

            - name: Install yini-test-suite
              run: python -m pip install yini-test-suite==0.3.0rc1

            - name: Run yini-test-suite smoke tests against Go parser
              run: >
                  yini-test-suite smoke
                  --all-modes
                  --adapter "$RUNNER_TEMP/yini-test-adapter" --input '{input}' --mode '{mode}'
